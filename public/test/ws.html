<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>WS Test</title></head>
<body>
  <h2>WebSocket Transaction Stream</h2>
  <pre id="log"></pre>
  <script>
    const log = document.getElementById('log')
    const ws = new WebSocket('wss://your-domain.com/ws')

    ws.onmessage = e => {
      const data = JSON.parse(e.data)
      log.textContent += JSON.stringify(data, null, 2) + '\n'
    }

    ws.onopen = () => log.textContent += '🟢 Connected\n'
    ws.onclose = () => log.textContent += '🔴 Disconnected\n'
  </script>
</body>
</html>
